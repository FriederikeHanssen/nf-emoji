name: CI

on:
  push:
    branches: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        java-version: [17, 21]
        nf-version: ["25.04.3", "25.10.0"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nf-version }}

      - name: Run tests
        run: make test

      - name: Install plugin
        run: make install
