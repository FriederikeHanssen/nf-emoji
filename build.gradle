plugins {
    id 'io.nextflow.nextflow-plugin' version '1.0.0-beta.12'
}

version = '0.1.0'

nextflowPlugin {
    nextflowVersion = '24.10.0'

    provider = 'rike'
    description = 'Add emoji flair to your Nextflow pipeline runs'
    className = 'rike.plugin.EmojiPlugin'
    extensionPoints = [
        'rike.plugin.EmojiExtension',
        'rike.plugin.EmojiFactory'
    ]

}
